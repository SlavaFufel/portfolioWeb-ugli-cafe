<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2A1C12" />

    <!-- Preload the LCP hero image so it isn't discovered only after the JS bundle runs -->
    <link rel="preload" as="image" href="/images/hero-2.jpg" fetchpriority="high" />

    <title>Угли — ремесленная кофейня и обжарочная в Москве</title>
    <meta
      name="description"
      content="Кофе собственной обжарки, завтраки весь день и бранч на углях. Живое меню, бронь столика онлайн, доставка. Покровка, 17. С 1962 года."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="restaurant" />
    <meta property="og:title" content="Угли — ремесленная кофейня в Москве" />
    <meta
      property="og:description"
      content="Кофе своей обжарки, завтраки весь день и бранч на углях. С 1962 года."
    />
    <meta property="og:image" content="/images/hero-2.jpg" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Fonts: Fraunces (display, optical + italic) + Manrope (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
